; dsp-cpp for the ESP32 "Cheap Yellow Display" with PlatformIO (alternative to build.sh):
;   ./setup.sh --zlib-only      (once: zlib into deps/)
;   pio run -t upload           (build and flash)
; Drivers, embedded media and panel/touch settings come from the custom_dsp_*
; options below (same meaning as the prepare.py options).

[platformio]
src_dir = dsp_cyd
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17, as build.sh
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DDSP_FS_POSIX=1
    -DDSP_FS_TEMP_DIR=\"/sd/tmp\"
extra_scripts = pre:pio_prepare.py
monitor_speed = 115200
upload_speed = 921600

custom_dsp_drivers = a2600;atari_lynx;gameboy
; extra prepare.py options, e.g. --panel st7789 --touch-cal 300,3800,200,3700
custom_dsp_prepare_args =
custom_dsp_embed_game =
custom_dsp_embed_rom =
custom_dsp_embed_tape =
custom_dsp_embed_disk =
custom_dsp_embed_cart =
custom_dsp_embed_args =

; A board with PSRAM (WROVER module): pio run -e cyd-psram
[env:cyd-psram]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
