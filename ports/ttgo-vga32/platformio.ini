; dsp-cpp for the LilyGO TTGO VGA32 with PlatformIO (alternative to build.sh):
;   ./setup.sh --zlib-only      (once: zlib into deps/)
;   pio run -t upload           (build and flash)
; Drivers and embedded media are chosen with the custom_dsp_* options below
; (same meaning as the prepare.py options); pio_prepare.py applies them.

[platformio]
src_dir = dsp_vga32
default_envs = ttgo-vga32

[env:ttgo-vga32]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17, as build.sh
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
lib_deps = fdivitto/FabGL@1.0.9
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -DDSP_FS_POSIX=1
    -DDSP_FS_TEMP_DIR=\"/sd/tmp\"
extra_scripts = pre:pio_prepare.py
monitor_speed = 115200
upload_speed = 921600

custom_dsp_drivers = galaxian;arabian;bagman;mrdo;sg1000;spectrum
; Embedded media, e.g. custom_dsp_embed_game = blockout
;                      custom_dsp_embed_rom = /home/me/roms/blockout.zip
custom_dsp_embed_game =
custom_dsp_embed_rom =
custom_dsp_embed_tape =
custom_dsp_embed_disk =
custom_dsp_embed_cart =
custom_dsp_embed_args =
